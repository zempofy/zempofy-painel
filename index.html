<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zempofy — Painel Administrativo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #09090b; color: #fafafa; font-family: 'Inter', sans-serif; min-height: 100vh; }
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    .login { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .login-card { background: #18181b; border: 1px solid #27272a; border-radius: 16px; padding: 32px; width: 100%; max-width: 360px; }
    .logo { font-size: 1.5rem; font-weight: 800; color: #00b141; letter-spacing: -0.03em; margin-bottom: 8px; }
    .logo span { color: #71717a; font-size: 0.75rem; font-weight: 500; display: block; margin-top: 2px; letter-spacing: 0; }
    h2 { font-size: 1.1rem; font-weight: 600; margin: 20px 0 6px; }
    p.sub { font-size: 0.82rem; color: #71717a; margin-bottom: 20px; }
    input { width: 100%; padding: 10px 14px; background: #1c1c1f; border: 1px solid #27272a; border-radius: 8px; color: #fff; font-size: 0.875rem; font-family: inherit; margin-bottom: 12px; }
    input:focus { outline: none; border-color: #00b141; }
    button.btn-primary { width: 100%; background: linear-gradient(135deg, #00b141, #008f34); color: #fff; border: none; border-radius: 8px; padding: 11px; font-weight: 600; font-size: 0.9rem; cursor: pointer; font-family: inherit; }
    .erro { color: #f87171; font-size: 0.8rem; margin-bottom: 10px; background: rgba(248,113,113,0.08); padding: 8px 12px; border-radius: 8px; }

    /* Dashboard */
    #dashboard { display: none; }
    .topbar { background: #111113; border-bottom: 1px solid #27272a; padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; }
    .topbar .logo { margin: 0; font-size: 1.2rem; }
    .topbar .sair { background: none; border: 1px solid #27272a; border-radius: 6px; color: #71717a; padding: 6px 14px; cursor: pointer; font-size: 0.8rem; font-family: inherit; }
    .content { padding: 28px; max-width: 1200px; margin: 0 auto; }
    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 28px; }
    .metric { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 16px 20px; }
    .metric .label { font-size: 0.65rem; font-weight: 700; color: #71717a; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
    .metric .valor { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.02em; }
    .metric .sub { font-size: 0.72rem; color: #71717a; margin-top: 3px; }
    table { width: 100%; border-collapse: collapse; background: #18181b; border: 1px solid #27272a; border-radius: 12px; overflow: hidden; }
    th { font-size: 0.65rem; font-weight: 700; color: #71717a; text-transform: uppercase; letter-spacing: 0.8px; padding: 12px 16px; text-align: left; border-bottom: 1px solid #27272a; background: #111113; }
    td { padding: 12px 16px; font-size: 0.85rem; border-bottom: 1px solid #1f1f22; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    .badge { display: inline-block; font-size: 0.7rem; font-weight: 600; padding: 2px 9px; border-radius: 99px; }
    .badge.ativo { background: rgba(0,177,65,0.12); color: #00b141; }
    .badge.inativo { background: rgba(248,113,113,0.12); color: #f87171; }
    .badge.starter { background: rgba(99,102,241,0.12); color: #818cf8; }
    .badge.pro { background: rgba(245,158,11,0.12); color: #f59e0b; }
    .badge.escala { background: rgba(0,177,65,0.12); color: #00b141; }
    .loading { text-align: center; padding: 60px; color: #71717a; }
    .sec-titulo { font-size: 1rem; font-weight: 600; margin-bottom: 16px; }
    .atualizado { font-size: 0.72rem; color: #71717a; margin-bottom: 20px; }
    .busca { width: 100%; max-width: 320px; margin-bottom: 16px; }
  </style>
</head>
<body>

<!-- Login -->
<div class="login" id="tela-login">
  <div class="login-card">
    <div class="logo">Zempofy <span>Painel Administrativo</span></div>
    <h2>Acesso restrito</h2>
    <p class="sub">Este painel é exclusivo da equipe Zempofy.</p>
    <div id="erro-login" class="erro" style="display:none"></div>
    <input type="password" id="input-chave" placeholder="Chave de acesso" onkeydown="if(event.key==='Enter')entrar()" />
    <button class="btn-primary" onclick="entrar()">Entrar</button>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard">
  <div class="topbar">
    <div class="logo">Zempofy <span style="display:inline;font-size:0.7rem;color:#71717a;margin-left:8px">Painel Admin</span></div>
    <button class="sair" onclick="sair()">Sair</button>
  </div>
  <div class="content">
    <div id="corpo" class="loading">Carregando dados...</div>
  </div>
</div>

<script>
  const API = 'https://zempofyofc.onrender.com/api';
  let chaveAtual = '';

  function entrar() {
    const chave = document.getElementById('input-chave').value.trim();
    if (!chave) return;
    chaveAtual = chave;
    sessionStorage.setItem('zp_key', chave);
    mostrarDashboard();
  }

  function sair() {
    sessionStorage.removeItem('zp_key');
    chaveAtual = '';
    document.getElementById('tela-login').style.display = 'flex';
    document.getElementById('dashboard').style.display = 'none';
  }

  async function mostrarDashboard() {
    document.getElementById('tela-login').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('corpo').innerHTML = '<div class="loading">Carregando dados...</div>';

    try {
      const res = await fetch(`${API}/painel`, {
        headers: { 'x-admin-key': chaveAtual }
      });
      if (res.status === 401) {
        document.getElementById('erro-login').textContent = 'Chave incorreta.';
        document.getElementById('erro-login').style.display = 'block';
        document.getElementById('tela-login').style.display = 'flex';
        document.getElementById('dashboard').style.display = 'none';
        return;
      }
      const data = await res.json();
      renderizar(data);
    } catch (e) {
      document.getElementById('corpo').innerHTML = '<div class="loading">Erro ao conectar com o servidor. Tente novamente.</div>';
    }
  }

  function formatarData(d) {
    if (!d) return '—';
    return new Date(d).toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric' });
  }

  function renderizar(data) {
    const { totalEmpresas, empresasAtivas, empresas, geradoEm } = data;
    const inativos = totalEmpresas - empresasAtivas;

    document.getElementById('corpo').innerHTML = `
      <div class="metrics">
        <div class="metric">
          <div class="label">Total de empresas</div>
          <div class="valor">${totalEmpresas}</div>
          <div class="sub">cadastradas</div>
        </div>
        <div class="metric">
          <div class="label">Ativas</div>
          <div class="valor" style="color:#00b141">${empresasAtivas}</div>
          <div class="sub">em uso</div>
        </div>
        <div class="metric">
          <div class="label">Inativas</div>
          <div class="valor" style="color:#f87171">${inativos}</div>
          <div class="sub">sem acesso</div>
        </div>
        <div class="metric">
          <div class="label">Total colaboradores</div>
          <div class="valor">${empresas.reduce((a,e)=>a+e.totalUsuarios,0)}</div>
          <div class="sub">em todas as empresas</div>
        </div>
      </div>

      <div class="sec-titulo">Empresas cadastradas</div>
      <p class="atualizado">Atualizado em ${new Date(geradoEm).toLocaleString('pt-BR')}</p>
      <input class="busca" type="text" placeholder="Buscar empresa..." oninput="filtrarTabela(this.value)" />

      <table id="tabela-empresas">
        <thead>
          <tr>
            <th>Empresa</th>
            <th>Titular</th>
            <th>Plano</th>
            <th>Usuários</th>
            <th>Onboardings ativos</th>
            <th>Concluídos</th>
            <th>Status</th>
            <th>Cadastro</th>
          </tr>
        </thead>
        <tbody>
          ${empresas.map(e => `
            <tr>
              <td>
                <div style="font-weight:600">${e.nome || '—'}</div>
                ${e.cnpj ? `<div style="font-size:0.72rem;color:#71717a">${e.cnpj}</div>` : ''}
              </td>
              <td>
                ${e.titular ? `
                  <div>${e.titular.nome}</div>
                  <div style="font-size:0.72rem;color:#71717a">${e.titular.email}</div>
                ` : '<span style="color:#71717a">—</span>'}
              </td>
              <td><span class="badge ${e.plano||'starter'}">${(e.plano||'starter').charAt(0).toUpperCase()+(e.plano||'starter').slice(1)}</span></td>
              <td>${e.totalUsuarios}</td>
              <td>${e.implantacoesAtivas}</td>
              <td>${e.implantacoesConcluidas}</td>
              <td><span class="badge ${e.ativa?'ativo':'inativo'}">${e.ativa?'Ativa':'Inativa'}</span></td>
              <td style="font-size:0.78rem;color:#71717a">${formatarData(e.criadaEm)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }

  function filtrarTabela(busca) {
    const linhas = document.querySelectorAll('#tabela-empresas tbody tr');
    linhas.forEach(linha => {
      linha.style.display = linha.textContent.toLowerCase().includes(busca.toLowerCase()) ? '' : 'none';
    });
  }

  // Auto-login se já tiver chave salva
  const chaveSalva = sessionStorage.getItem('zp_key');
  if (chaveSalva) { chaveAtual = chaveSalva; mostrarDashboard(); }
</script>
</body>
</html>
